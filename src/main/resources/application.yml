spring:
  application:
    name: chen-ai-agent
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/chenmanus-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
      connect-timeout: 2s
      timeout: 3s
  ai:
    mcp:
      client:
        enabled: true
        servers-configuration: classpath:mcp-servers.json
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      chroma:
        collection-name: love-app-knowledge
        initialize-schema: true
        client:
          host: http://127.0.0.1
          port: 8000
  security:
    api-key: ${API_KEY}

server:
  port: 8123
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    chroma:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: "/**"
      packages-to-scan: io.github.chenyouxin8.chenaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ${SEARCH_API_KEY}

chenmanus:
  memory:
    dir: ./data/task-memory
  queue:
    redis-enabled: ${CHENMANUS_REDIS_ENABLED:false}
    key: ${CHENMANUS_QUEUE_KEY:chenmanus:tasks}
    poll-ms: ${CHENMANUS_QUEUE_POLL_MS:250}
  lock:
    redis-enabled: ${CHENMANUS_REDIS_ENABLED:false}
  metrics:
    input-cost-per-1k: ${CHENMANUS_INPUT_COST_PER_1K:0.0}
    output-cost-per-1k: ${CHENMANUS_OUTPUT_COST_PER_1K:0.0}
