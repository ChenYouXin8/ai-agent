spring:
  application:
    name: chen-ai-agent
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/chenmanus-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
      connect-timeout: 2s
      timeout: 3s
  ai:
    mcp:
      client:
        # MCP 客户端默认开启；未配置 stdio servers-configuration 时不启动任何外部 MCP 服务，应用可正常启动。
        # 含密钥的 stdio 服务配置（mcp-servers.json）仅在本地 profile 中加载，
        # 见 application-local.example.yml；切勿在主配置里写死该文件路径。
        enabled: true
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 未配置时使用占位值，保证应用可零配置启动（如冒烟测试）；真实调用需通过环境变量注入有效 Key。
      api-key: ${AI_DASHSCOPE_API_KEY:dummy-api-key}
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      chroma:
        collection-name: chenmanus-memory
        initialize-schema: true
        client:
          host: http://127.0.0.1
          port: 8000
  security:
    api-key: ${API_KEY:}

server:
  port: 8123
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    chroma:
      enabled: true
    # Redis 为可选组件（默认关闭）。健康检查与 CHENMANUS_REDIS_ENABLED 联动，
    # 未启用 Redis 时不再因连不上 6379 而把整体健康状态拉成 DOWN。
    redis:
      enabled: ${CHENMANUS_REDIS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: "/**"
      packages-to-scan: io.github.chenyouxin8.chenaiagent.controller

search-api:
  # 未配置时使用占位值，保证应用可零配置启动；联网搜索功能需配置真实 Key。
  api-key: ${SEARCH_API_KEY:dummy-search-key}

chenmanus:
  security:
    mode: ${CHENMANUS_SECURITY_MODE:legacy}
    trust-identity-headers: ${CHENMANUS_TRUST_IDENTITY_HEADERS:false}
    require-identity-headers: ${CHENMANUS_REQUIRE_IDENTITY_HEADERS:false}
    legacy-admin-token: ${CHENMANUS_LEGACY_ADMIN_TOKEN:}
    oidc:
      issuer-uri: ${CHENMANUS_OIDC_ISSUER_URI:}
      audience: ${CHENMANUS_OIDC_AUDIENCE:}
  approval:
    enabled: ${CHENMANUS_APPROVAL_ENABLED:true}
    required-types: ${CHENMANUS_APPROVAL_REQUIRED_TYPES:DEPLOY,PURCHASE,PAYMENT}
    required-keywords: ${CHENMANUS_APPROVAL_REQUIRED_KEYWORDS:deploy,deployment,publish,publishing,send,sending,delete,deleting,purchase,pay,payment,production,prod,shutdown,release,发布,部署,上线,发送,删除,购买,支付,生产,停机,发布配置}
  memory:
    dir: ./data/task-memory
  queue:
    redis-enabled: ${CHENMANUS_REDIS_ENABLED:false}
    key: ${CHENMANUS_QUEUE_KEY:chenmanus:tasks}
    poll-ms: ${CHENMANUS_QUEUE_POLL_MS:250}
  lock:
    redis-enabled: ${CHENMANUS_REDIS_ENABLED:false}
  runtime:
    max-parallel-steps: ${CHENMANUS_MAX_PARALLEL_STEPS:4}
  quota:
    max-active-tasks-per-tenant: ${CHENMANUS_MAX_ACTIVE_TASKS_PER_TENANT:20}
  metrics:
    input-cost-per-1k: ${CHENMANUS_INPUT_COST_PER_1K:0.0}
    output-cost-per-1k: ${CHENMANUS_OUTPUT_COST_PER_1K:0.0}
  artifacts:
    allowed-root: ${CHENMANUS_ARTIFACT_ALLOWED_ROOT:./data}
