services:
  # ---------- 1. PostgreSQL durable task database ----------
  postgres:
    image: postgres:17-alpine
    container_name: chen-ai-agent-postgres
    environment:
      POSTGRES_DB: chenmanus
      POSTGRES_USER: chenmanus
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-chenmanus}"
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chenmanus -d chenmanus"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 2. Redis queue + distributed lock ----------
  redis:
    image: redis:7-alpine
    container_name: chen-ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 3. Chroma vector database ----------
  chroma:
    image: chromadb/chroma:0.5.15
    container_name: chen-ai-agent-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma/.chromadb
    environment:
      IS_PERSISTENT: "TRUE"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------- 4. Spring Boot backend ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chen-ai-agent-backend
    ports:
      - "8123:8123"
    environment:
      AI_DASHSCOPE_API_KEY: "${AI_DASHSCOPE_API_KEY}"
      API_KEY: "${API_KEY:-}"
      SEARCH_API_KEY: "${SEARCH_API_KEY:-}"
      SPRING_PROFILES_ACTIVE: "local"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/chenmanus"
      DATABASE_USERNAME: "chenmanus"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-chenmanus}"
      DATABASE_DRIVER: "org.postgresql.Driver"
      REDIS_URL: "redis://redis:6379"
      CHENMANUS_REDIS_ENABLED: "true"
      CHENMANUS_QUEUE_KEY: "chenmanus:tasks"
      CHENMANUS_QUEUE_POLL_MS: "250"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data/chat-memory:/app/.chat-memory
      - ./data/task-memory:/app/data/task-memory

  # ---------- 5. Vue frontend ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chen-ai-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: chen-ai-agent-net
