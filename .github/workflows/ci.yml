name: ChenManus CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend
        run: |
          chmod +x mvnw
          ./mvnw -q -DskipTests package
      - name: Run offline unit tests
        run: |
          chmod +x mvnw
          ./mvnw -q -Dtest=FileBasedChatMemoryTest,FileOperationToolTest,TaskRepositoryTest,TaskQuotaServiceTest,TaskQueueServiceTest,TaskMetricsServiceTest,ArtifactServiceTest,ArtifactAccessServiceTest,AgentRolePromptServiceTest,RequestIdentityServiceTest,TaskMemoryTenantIsolationTest,TaskScopeServiceTest,TaskApprovalPolicyServiceTest,TaskApprovalServiceTest,TaskManagerTest test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chen-ai-agent-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chen-ai-agent-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
